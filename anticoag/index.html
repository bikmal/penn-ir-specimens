<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAH IR Anticoag Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single column; search on top, list OR answer below, never both */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --fg:#141b2d; --muted:#5a6478; --line:#dde2ea;
  --accent:#1f3f8f; --accent-soft:#e6ecf8;
  --a:#17803d; --a-soft:#e3f4e8; --b:#a65f00; --b-soft:#fdf0dc; --c:#b42318; --c-soft:#fde7e5;
  --f-display:"Source Serif 4", Georgia, serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141f; --surface:#171e2c; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2a3345;
  --accent:#8fb0ff; --accent-soft:#1d2a47;
  --a:#5fd38a; --a-soft:#143222; --b:#f2b45a; --b-soft:#36280f; --c:#ff8a7f; --c-soft:#3a1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141f; --surface:#171e2c; --fg:#e7ebf3; --muted:#9aa4b8; --line:#2a3345;
  --accent:#8fb0ff; --accent-soft:#1d2a47;
  --a:#5fd38a; --a-soft:#143222; --b:#f2b45a; --b-soft:#36280f; --c:#ff8a7f; --c-soft:#3a1714; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:2px 0 12px;text-wrap:balance}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px 10px;display:flex;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.search button{font:inherit;font-weight:600;font-size:14px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.proc:focus-visible,.search button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.group{margin-bottom:12px}
.group h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:700;display:flex;gap:8px;align-items:center}
.group ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.group li+li{border-top:1px solid var(--line)}
.proc{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;font:inherit;background:none;border:0;color:var(--fg);padding:9px 12px;cursor:pointer}
.proc:hover{background:var(--accent-soft)}
.proc small{color:var(--muted);font-size:13px}
.badge{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:500;width:22px;height:22px;display:inline-grid;place-items:center;border-radius:6px}
.badge.A{background:var(--a-soft);color:var(--a)} .badge.B{background:var(--b-soft);color:var(--b)} .badge.C{background:var(--c-soft);color:var(--c)}
.empty{color:var(--muted);padding:12px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.ph.A{background:var(--a-soft)} .ph.B{background:var(--b-soft)} .ph.C{background:var(--c-soft)}
.ph .cat{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.ph.A .cat{color:var(--a)} .ph.B .cat{color:var(--b)} .ph.C .cat{color:var(--c)}
.ph h3{font-family:var(--f-display);font-size:21px;line-height:1.2;margin:0;text-wrap:balance}
.ph p{margin:0;font-size:13px;color:var(--muted)}
.sec{padding:12px 16px;border-top:1px solid var(--line)}
.sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.labs{font-size:15px}
.labs b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.labs p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row.hd{font-size:12px;color:var(--muted);font-weight:600;padding-top:0}
.row b{font-weight:600}
.row small{display:block;color:var(--muted);font-size:12px}
.hold{color:var(--c);font-weight:600}
.na{color:var(--muted)}
.ok{font-size:14px}
.ok b{color:var(--a)}
.flag{font-size:13px;background:var(--b-soft);padding:8px 16px}
.big{font-size:16px;font-weight:600;color:var(--a)}
footer{margin-top:20px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
@media (max-width:420px){.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.row .m{grid-column:1/-1}.row.hd .m{display:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Pennsylvania Hospital · IR</div>
  <h1>Anticoag &amp; Coag Lab Guide</h1>
  <div class="search">
    <input id="q" type="search" placeholder="Type a procedure (port, TIPS, biopsy…)" autocomplete="off" aria-label="Search procedures">
    <button id="back" hidden>All</button>
  </div>
  <main id="out" aria-live="polite"></main>
  <footer>
    <div>Guidelines, not hard policies. Exceptions are at the discretion of the performing IR attending.</div>
    <div>From the posted PAH IR guideline sheets (updated 10/23/2025).</div>
    <div>Questions or corrections? Email <a href="mailto:anirudhbikmal@gmail.com?subject=PAH%20IR%20Anticoag%20Guide" style="color:var(--accent)">anirudhbikmal@gmail.com</a></div>
    <div>Built by <b>Anirudh Bikmal</b></div>
  </footer>
</div>

<script>
const CATS = {
  A:{label:"Category A", risk:"Low risk"},
  B:{label:"Category B", risk:"Moderate risk"},
  C:{label:"Category C", risk:"High risk"}
};

const PROCS = [
  // Category A
  ["A","Abdominal wall Botox injection"],
  ["A","Abscess aspiration / new abscess drain — superficial"],
  ["A","Bone marrow biopsy","No platelet threshold"],
  ["A","Drain exchange","Abscess, biliary, cholecystostomy, G/GJ, PCN/PCNU/JJ"],
  ["A","Fine needle aspiration — superficial","Superficial lymph node, thyroid"],
  ["A","IVC filter placement"],
  ["A","IVC filter removal — routine","Non-complex retrieval"],
  ["A","Joint aspiration"],
  ["A","Pain injection — peripheral only","Bursae, facets, peripheral joints (hips/knees/shoulders), peripheral nerve roots"],
  ["A","Paracentesis","No INR threshold"],
  ["A","Thrombin injection"],
  ["A","Vein mapping"],
  ["A","Venous access — non-tunneled catheter","Dialysis catheter, pheresis catheter, PICC, small bore central catheter, tunneled catheter exchange"],
  ["A","Venous access catheter removal","e.g. TDC removal (NOT chest port removal)"],
  ["A","Venous pulmonary intervention","Lysis catheter placement or removal"],
  // Category B
  ["B","Abscess aspiration / new drain — deep"],
  ["B","Arterial embolization (5–6 Fr sheath)","e.g. GI bleed, TACE, UAE"],
  ["B","Biopsy — superficial core or transjugular liver"],
  ["B","Chest tube placement","Marked with a handwritten * on the posted sheet"],
  ["B","Dialysis access intervention","Fistulogram, declot"],
  ["B","GI bleed embolization"],
  ["B","Hydrocele aspiration and sclerosis"],
  ["B","Lumbar puncture","LP, myelogram, intrathecal injections (e.g. chemotherapy, baclofen)"],
  ["B","Thoracentesis"],
  ["B","TIPS revision"],
  ["B","Tunneled drain placement","Peritoneal or pleural"],
  ["B","Uterine artery embolization (UAE)"],
  ["B","Venous access — chest port","Port placement / revision / removal, TDC placement"],
  ["B","Venous non-pulmonary intervention","e.g. IVC stent, pelvic congestion embolization, varicocele embolization"],
  // Category C
  ["C","Ablation (cryo or microwave)","Liver, lung, or renal"],
  ["C","Arterial intervention requiring 7 Fr sheath (rare)","e.g. central arterial stent"],
  ["C","Biliary drain — new placement","Percutaneous cholecystostomy, biliary drain"],
  ["C","Biopsy — deep","e.g. retroperitoneal lymph node"],
  ["C","Biopsy — solid organ","e.g. percutaneous liver, lung, renal"],
  ["C","Epidural injection","Blood patch, steroids"],
  ["C","Gastrostomy / gastrojejunostomy — new placement"],
  ["C","IVC filter removal — complex"],
  ["C","Lumbar drain"],
  ["C","Kyphoplasty / vertebroplasty"],
  ["C","TIPS placement"],
  ["C","Urinary tract drain placement","PCN, PCNU, or suprapubic catheter"]
].map(([cat,name,sub],i)=>({id:i,cat,name,sub:sub||""}));

const MEDS = [
  {k:"warf", n:"Warfarin", s:"Coumadin"},
  {k:"apix", n:"Apixaban / dabigatran", s:"Eliquis / Pradaxa"},
  {k:"riva", n:"Rivaroxaban", s:"Xarelto"},
  {k:"hep",  n:"Heparin / argatroban / bivalirudin", s:"IV infusion"},
  {k:"fonda",n:"Fondaparinux", s:"Arixtra"},
  {k:"lmwh", n:"Enoxaparin, therapeutic", s:"Lovenox"},
  {k:"ppx",  n:"Prophylactic anticoagulation", s:"DVT prophylaxis dosing"},
  {k:"asa",  n:"Aspirin", s:"Antiplatelet"},
  {k:"p2y",  n:"Clopidogrel / ticagrelor / prasugrel", s:"Plavix / Brilinta / Effient"}
];

// pre/post values: string, or {gt,lt} for GFR-dependent text. "NH" = do not hold.
const RULES = {
  A:{
    labs:{plt:">20k", inr:"<2.6", when:"Do NOT screen"},
    labNotes:["Do NOT screen for platelets or INR.","If labs are already known, thresholds are plt >20k and INR <2.6.","Exceptions: bone marrow biopsy has no platelet threshold; paracentesis has no INR threshold."],
    pre:Object.fromEntries(MEDS.map(m=>[m.k,"NH"])),
    post:Object.fromEntries(MEDS.map(m=>[m.k,"Not applicable (not held)"]))
  },
  B:{
    labs:{plt:">50k", inr:"<1.8", when:"Within 3 months"},
    labNotes:["Screen for platelets and INR within the past 3 months.","If labs are not available, new labs are not required unless the patient is on Coumadin.","If labs are available, thresholds are plt >50k and INR <1.8."],
    pre:{
      warf:"Hold 5 days; recheck INR day of procedure",
      apix:{gt:"Hold 4 doses", lt:"Hold 6 doses"},
      riva:{gt:"Hold 2 doses", lt:"Hold 3 doses"},
      hep:"Turn off when calling for patient to come down to IR",
      fonda:{gt:"Hold 2 days", lt:"Hold 3–5 days"},
      lmwh:"Hold 24 hours",
      ppx:"NH", asa:"NH", p2y:"NH"
    },
    post:{
      warf:"Restart next day",
      apix:"Restart next day", riva:"Restart next day",
      hep:"Restart in 4 hours WITHOUT loading dose",
      fonda:"Restart next day",
      lmwh:null,
      ppx:"Restart evening of procedure",
      asa:"Not applicable (not held)", p2y:"Not applicable (not held)"
    }
  },
  C:{
    labs:{plt:">50k", inr:"<1.8", when:"Within 1 month"},
    labNotes:["Screen for platelets and INR within 1 month of the procedure.","If labs are not available, new labs are required.","Thresholds are plt >50k and INR <1.8."],
    pre:{
      warf:"Hold 5 days; recheck INR day of procedure",
      apix:{gt:"Hold 4 doses", lt:"Hold 6 doses"},
      riva:{gt:"Hold 2 doses", lt:"Hold 3 doses"},
      hep:"Off for 4 hours prior to procedure",
      fonda:{gt:"Withhold 2/3 days", lt:"Withhold 3–5 days"},
      lmwh:"Hold 24 hours",
      ppx:"Ideally hold 24 hours",
      asa:"Hold 5 days", p2y:"Hold 5 days"
    },
    post:{
      warf:"Restart next day",
      apix:"Restart next day", riva:"Restart next day",
      hep:"Restart in 4 hours WITHOUT loading dose",
      fonda:"Restart next day",
      lmwh:null,
      ppx:"Restart next day",
      asa:"Restart next day", p2y:"Restart next day"
    }
  }
};


const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let sel=null;

function txt(v){
  if(typeof v==="object"&&v) return `${esc(v.gt)} <span class="na">(${esc(v.lt.replace(/^(Hold|Withhold) /,""))} if GFR&nbsp;&lt;60)</span>`;
  return esc(v);
}

function showList(){
  sel=null; $("#back").hidden=true;
  const terms=$("#q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hit=p=>terms.every(t=>(p.name+" "+p.sub).toLowerCase().includes(t));
  const matches=PROCS.filter(hit);
  if(terms.length && matches.length===1){ return showCard(matches[0]); }
  let h="";
  for(const c of ["A","B","C"]){
    const items=matches.filter(p=>p.cat===c); if(!items.length) continue;
    h+=`<div class="group"><h2><span class="badge ${c}">${c}</span>${CATS[c].risk}</h2><ul>`+
      items.map(p=>`<li><button class="proc" data-id="${p.id}"><span class="badge ${c}">${c}</span><span>${esc(p.name)}${p.sub?` <small>· ${esc(p.sub)}</small>`:""}</span></button></li>`).join("")+`</ul></div>`;
  }
  $("#out").innerHTML=h||`<div class="empty">No match. Try a shorter word, or ask the attending.</div>`;
}

function showCard(p){
  sel=p.id; $("#back").hidden=false;
  const r=RULES[p.cat];
  const plt=p.name.startsWith("Bone marrow")?"no threshold":r.labs.plt;
  const inr=p.name==="Paracentesis"?"no threshold":r.labs.inr;
  let labs, meds;
  if(p.cat==="A"){
    labs=`<div class="labs">No screening labs needed.<p>If labs are known: plt <b>${esc(plt)}</b>, INR <b>${esc(inr)}</b>.</p></div>`;
    meds=`<div class="big">Do NOT hold anything.</div><div class="na" style="font-size:13px">No anticoagulants or antiplatelets held, so nothing to restart.</div>`;
  } else {
    const req=p.cat==="C"?"Labs within <b>1 month</b> required. Draw new labs if none.":"Labs within <b>3 months</b>. If none, new labs only if on Coumadin.";
    labs=`<div class="labs">Plt <b>${esc(plt)}</b> · INR <b>${esc(inr)}</b><p>${req}</p></div>`;
    const held=MEDS.filter(m=>r.pre[m.k]!=="NH"), kept=MEDS.filter(m=>r.pre[m.k]==="NH");
    meds=`<div class="row hd"><span class="m">Medication</span><span>Before</span><span>After</span></div>`+
      held.map(m=>`<div class="row"><span class="m"><b>${esc(m.n)}</b><small>${esc(m.s)}</small></span><span class="hold">${txt(r.pre[m.k])}</span><span>${r.post[m.k]===null?'<span class="na">Not on sheet</span>':esc(r.post[m.k])}</span></div>`).join("")+
      (kept.length?`<div class="ok" style="margin-top:8px"><b>Do NOT hold:</b> ${kept.map(m=>esc(m.n.toLowerCase())).join(", ")}.${p.cat==="B"?' Prophylactic anticoag: if held, restart evening of procedure.':''}</div>`:"");
  }
  const flag=/Chest tube/.test(p.name)?`<div class="flag">Handwritten * next to this on the posted sheet. Confirm with the attending.</div>`:"";
  $("#out").innerHTML=`<div class="card">
    <div class="ph ${p.cat}"><div class="cat">Category ${p.cat} · ${CATS[p.cat].risk}</div><h3>${esc(p.name)}</h3>${p.sub?`<p>${esc(p.sub)}</p>`:""}</div>
    ${flag}
    <div class="sec"><h4>Labs</h4>${labs}</div>
    <div class="sec"><h4>Meds</h4>${meds}</div></div>`;
  window.scrollTo({top:0});
}

$("#q").addEventListener("input",showList);
$("#back").addEventListener("click",()=>{$("#q").value="";showList();$("#q").focus();});
$("#out").addEventListener("click",e=>{const b=e.target.closest(".proc"); if(b) showCard(PROCS[+b.dataset.id]);});
showList();
</script>
</body>
</html>
